
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/esqueci_senha.css">
    <title>Esqueci minha senha - AAPM</title>
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>Esqueci minha senha</h1>

            <p class="auth-description">
                Informe o e-mail do administrador para receber
                o link de redefinição de senha.
            </p>

            {% if sucesso %}
                <div class="alert alert-success">
                    {{ sucesso }}
                </div>
            {% endif %}

            {% if erro %}
                <div class="alert alert-error">
                    {{ erro }}
                </div>
            {% endif %}

            <form
                method="POST"
                action="/auth/esqueci-senha"
            >

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                        autocomplete="email"
                    >

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Enviar link
                </button>

            </form>

            <div class="auth-footer">

                <a href="/auth/login">
                    Voltar para o login
                </a>

            </div>

        </div>
        
    </main>

</body>

</html>
